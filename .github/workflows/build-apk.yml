          NRJzTT0oQv/Z
          EOF
          cat > make_icons.py <<'EOF'
          # Builds the Android launcher icons (adaptive + legacy) from icon.jpg.
          # Usage: python3 make_icons.py <icon.jpg> <android-res-dir>
          import sys, os
          from PIL import Image, ImageDraw
          src, res = sys.argv[1], sys.argv[2]
          im = Image.open(src).convert('RGB')
          w, h = im.size
          edge = [im.getpixel((x, y)) for x in range(0, w, 8) for y in (0, h - 1)] + [im.getpixel((x, y)) for y in range(0, h, 8) for x in (0, w - 1)]
          bg = tuple(sum(c[i] for c in edge) // len(edge) for i in range(3))
          hexbg = '#%02X%02X%02X' % bg
          D = {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}
          for name, k in D.items():
              d = os.path.join(res, 'mipmap-' + name)
              os.makedirs(d, exist_ok=True)
              # adaptive foreground: 108dp canvas, picture at 66% so nothing is cropped by the mask
              fg = round(108 * k)
              canvas = Image.new('RGB', (fg, fg), bg)
              s = round(fg * 0.66)
              canvas.paste(im.resize((s, s), Image.LANCZOS), ((fg - s) // 2, (fg - s) // 2))
              canvas.save(os.path.join(d, 'ps_fg.png'))
              # legacy icons (48dp)
              sz = round(48 * k)
              sq = im.resize((sz, sz), Image.LANCZOS)
              sq.save(os.path.join(d, 'ic_launcher.png'))
              mask = Image.new('L', (sz * 4, sz * 4), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, sz * 4 - 1, sz * 4 - 1), fill=255)
              rd = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              rd.paste(sq, (0, 0), mask.resize((sz, sz), Image.LANCZOS))
              rd.save(os.path.join(d, 'ic_launcher_round.png'))
          # adaptive icon definitions (override Capacitor's default ones)
          v26 = os.path.join(res, 'mipmap-anydpi-v26')
          os.makedirs(v26, exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '  <background android:drawable="@color/ps_icon_bg"/>\n  <foreground android:drawable="@mipmap/ps_fg"/>\n</adaptive-icon>\n')
          for n in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(os.path.join(v26, n), 'w').write(xml)
          vals = os.path.join(res, 'values')
          os.makedirs(vals, exist_ok=True)
          open(os.path.join(vals, 'ps_icon.xml'), 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ps_icon_bg">%s</color>\n</resources>\n' % hexbg)
          print('icons done, background', hexbg)
          EOF
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 make_icons.py icon.jpg android/app/src/main/res

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
