      - name: Create Capacitor Android project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.personal.pokesurvivor",
            "appName": "PokeSurvivor Offline",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android
          # landscape
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          # draw into the notch area too
          sed -i 's#</style>#    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n  </style>#' android/app/src/main/res/values/styles.xml
          # fullscreen that the game can switch on/off (Settings > Mod)
          cat > android/app/src/main/java/com/personal/pokesurvivor/MainActivity.java <<'EOF'
          package com.personal.pokesurvivor;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private boolean immersive = true;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              // The game can switch fullscreen on/off from its Mod settings (window.PSNative.setImmersive).
              getBridge().getWebView().addJavascriptInterface(new Object() {
                @JavascriptInterface
                public void setImmersive(final boolean on) {
                  runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                      immersive = on;
                      applyBars();
                    }
                  });
                }
              }, "PSNative");
              applyBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) applyBars();
            }

            private void applyBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              if (immersive) {
                WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                c.hide(WindowInsetsCompat.Type.systemBars());
              } else {
                WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                c.show(WindowInsetsCompat.Type.systemBars());
              }
            }
          }
          EOF

