      - name: Create Capacitor Android project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.personal.pokesurvivor",
            "appName": "PokeSurvivor Offline",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android
          # landscape
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          # draw into the notch area too
          sed -i 's#</style>#    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n  </style>#' android/app/src/main/res/values/styles.xml
          # immersive fullscreen: hide the status/navigation bars (swipe from the edge to show them)
          cat > android/app/src/main/java/com/personal/pokesurvivor/MainActivity.java <<'EOF'
          package com.personal.pokesurvivor;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }

            private void hideBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          EOF

