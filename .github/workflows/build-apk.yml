name: Build PokeSurvivor APK (personal offline use, multipliers, local saves, custom icon)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch the game (official repo) and apply the personal patch
        run: |
          git clone --depth 1 https://github.com/JPTER78/pokesurvivor.git game
          cat > apply-xp-patch.js <<'EOF'
          // Personal-use patch for PokeSurvivor (offline APK): XP / drop multipliers + local-only saves.
          // Usage: node apply-xp-patch.js <game-dir>
          const fs = require('fs'), path = require('path');
          const root = process.argv[2];
          function patch(file, from, to) {
            const p = path.join(root, file);
            const s = fs.readFileSync(p, 'utf8');
            if (!s.includes(from)) throw new Error('Patch target not found in ' + file + ': ' + from);
            fs.writeFileSync(p, s.replace(from, to));
          }
          // 1) new device settings (default x1)
          patch('js/core/settings.js', "aimManual: false };", "aimManual: false, xpBoost: 1, dropBoost: 1 };");
          // 2) XP multiplier (solo only)
          patch('js/entities/player.js', "const add = amount * this.xpMul;",
            "const add = amount * this.xpMul * ((G.Coop && G.Coop.active) ? 1 : (G.Settings.get('xpBoost') || 1));");
          // 3) boosted runs never go to the online ranking
          patch('js/game.js', "if (tampered) return false;",
            "if (tampered) return false; if ((G.Settings.get('xpBoost') || 1) > 1 || (G.Settings.get('dropBoost') || 1) > 1) return false;");
          // 4) drop multiplier (coins and tickets), solo only
          patch('js/game.js', "let banked = { t1: 0, t10: 0 };",
            "const dropK = () => ((G.Coop && G.Coop.active) ? 1 : (G.Settings.get('dropBoost') || 1));\n  let banked = { t1: 0, t10: 0 };");
          patch('js/game.js', "pl.coins += p.value;", "pl.coins += p.value * dropK();");
          patch('js/game.js', "if (p.kind === 'ticket') pl.t1++; else pl.t10++;",
            "{ const k = dropK(); if (p.kind === 'ticket') pl.t1 += k; else pl.t10 += k; }");
          patch('js/game.js', "const coins = Math.round((parts.tiempo + parts.derrotados + parts.jefes + parts.recogidas) * mul);",
            "const coins = Math.round(((parts.tiempo + parts.derrotados + parts.jefes) * dropK() + parts.recogidas) * mul);");
          // 5) saves stay on this phone: never connect to the author's cloud project (local accounts)
          patch('js/core/db.js', "async function initCloud() {",
            "async function initCloud() {\n    localReason = 'config'; return false;");
          // 6) the options, in Settings > Graphics
          patch('js/ui/settings-ui.js',
            "+ toggle('fps', 'Mostrar FPS', 'Fotogramas por segundo, en la esquina de abajo.')",
            "+ toggle('fps', 'Mostrar FPS', 'Fotogramas por segundo, en la esquina de abajo.')\n" +
            "        + section('經驗倍率 · Multiplicador de EXP', '只在單人模式生效；倍率大於 ×1 時成績不會上傳排行榜。')\n" +
            "        + choice('xpBoost', [[1, '×1'], [2, '×2'], [5, '×5'], [10, '×10'], [20, '×20'], [50, '×50'], [100, '×100']])\n" +
            "        + section('掉落倍率 · Multiplicador de botín', '金幣、抽獎券（轉蛋券）與結算金幣的倍率，只在單人模式生效。')\n" +
            "        + choice('dropBoost', [[1, '×1'], [2, '×2'], [5, '×5'], [10, '×10'], [20, '×20'], [50, '×50'], [100, '×100']])");
          console.log('Patch applied');
          EOF
          node apply-xp-patch.js game
          mkdir -p app/www
          cd game
          # dev.html is the unminified source page: use it as the app's index.html
          cp dev.html ../app/www/index.html
          cp -r css js assets manifest.webmanifest favicon.ico ../app/www/
          # keep the author's license notices inside the app
          cat LICENSE LICENSE-NONCOMMERCIAL.md > ../app/www/LICENSES.txt

